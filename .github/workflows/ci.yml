name: CI

on:
  pull_request:
  push:
    branches: [master]

# One run per branch — a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans the full git history for committed secrets. Runs without any repo
  # secrets, so it is safe on fork PRs, and in parallel with `checks`.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned release + checksum verification instead of a third-party action
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan git history
        run: ./gitleaks git . --log-opts="--all" --redact -v --no-banner

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Everything runs against a throwaway local Supabase stack (Docker on the
    # runner), never the production project. The URL and keys are exported by
    # the "Start local Supabase" step below; the keys are the CLI's fixed
    # public demo values, not secrets.
    env:
      TEST_DB_ONLY: '1'
      # Dummy: the app only needs it to be present. Sends fail harmlessly, so
      # CI can never email a real person.
      RESEND_API_KEY: re_ci_dummy_key
      # Fixture accounts, created on the local stack by seed-test-users.ts.
      # ADMIN_EMAIL only gates this job's throwaway dev server.
      ADMIN_EMAIL: playwright-test-admin@example.com
      TEST_ADMIN_EMAIL: playwright-test-admin@example.com
      TEST_CREATOR_EMAIL: playwright-test-creator@example.com
      TEST_EXPERT_EMAIL: playwright-test-expert@example.com
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration numbering
        run: bun run migrate:check

      - name: Lint
        run: bun run lint

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Full Supabase (Postgres, Auth, Storage, API) in Docker, minus the
      # services the app does not use. Config: supabase/config.toml.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      - name: Export local Supabase env
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Also proves the whole migration history replays on an empty database
      - name: Apply migrations
        run: bun scripts/migrate.ts up --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Seed test users
        run: bun scripts/seed-test-users.ts

      # Idempotent upsert of the test-public-brief / test-members-brief fixtures
      # the brief specs rely on
      - name: Seed test briefs
        run: bun scripts/seed-test-briefs.ts

      - name: E2E tests
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Local Supabase logs
        if: failure()
        run: docker ps -a && supabase status || true
