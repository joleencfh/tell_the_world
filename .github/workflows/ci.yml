name: CI

on:
  pull_request:
  push:
    branches: [master]

# One run per branch — a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans the full git history for committed secrets. Runs without any repo
  # secrets, so it is safe on fork PRs, and in parallel with `checks`.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned release + checksum verification instead of a third-party action
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan git history
        run: ./gitleaks git . --log-opts="--all" --redact -v --no-banner

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Pointed at TEST_ADMIN_EMAIL, not the real ADMIN_EMAIL secret — this
      # only gates the throwaway dev server this job spins up (two-ink-bold
      # -plan.md Part 9b), never a real deployment. TEST_ADMIN_EMAIL is a
      # dedicated fixture account (playwright-test-admin@..., not a real
      # person's address).
      ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_CREATOR_EMAIL: ${{ secrets.TEST_CREATOR_EMAIL }}
      TEST_EXPERT_EMAIL: ${{ secrets.TEST_EXPERT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Idempotent upsert of the test-public-brief / test-members-brief fixtures
      # the brief specs rely on
      - name: Seed test briefs
        run: bun scripts/seed-test-briefs.ts

      # Runs against the live Supabase project (no staging environment yet).
      # The suite creates throwaway rows (applications, messages) per run.
      - name: E2E tests
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
